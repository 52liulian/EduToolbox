<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记录板 | EduToolbox · 课堂记录展示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="temp-board.css">
<link rel="stylesheet" href="../../assets/css/tool-common.css">
</head>
<body>

<!-- 工具栏：主题 / 字号 / 清空（全屏与隐藏设置已移到舞台右上角工具栏） -->
<section class="toolbar" id="toolbar">
  <div class="tool-group">
    <span class="tool-label">主题：</span>
    <button type="button" class="theme-dot active" data-board="white"  style="--c:#ffffff" title="白板"></button>
    <button type="button" class="theme-dot"        data-board="black"   style="--c:#1a1a1a" title="黑板"></button>
    <button type="button" class="theme-dot"        data-board="green"   style="--c:#1f4d2e" title="绿板"></button>
  </div>
  <div class="tool-group">
    <span class="tool-label">字号：</span>
    <button type="button" class="size-btn" id="fontDown" title="缩小字号">A−</button>
    <span class="size-val" id="sizeVal">32</span>
    <button type="button" class="size-btn" id="fontUp" title="放大字号">A+</button>
  </div>
  <div class="tool-group">
    <button type="button" class="btn btn-ghost" id="clearBtn" title="清空全部内容">🗑 清空</button>
  </div>
</section>

<!-- 大字记录区域 -->
<main class="stage" id="stage">
  <div class="stage-toolbar">
    <button type="button" class="icon-btn" id="fullscreenBtn" title="全屏">⛶</button>
    <button type="button" class="icon-btn" id="hideSetupBtn" title="隐藏设置">⚙</button>
  </div>
  <div class="board" id="board" contenteditable="true" spellcheck="false"
       data-placeholder="点击此处开始记录课堂要点、作业安排或临时通知..."></div>
</main>

<!-- 状态条 -->
<footer class="status" id="status">准备就绪</footer>

<script src="../../assets/js/frame-bridge.js"></script>
<script src="../../assets/js/tool-stage-toolbar.js"></script>
<script src="temp-board.js"></script>
</body>
</html>
