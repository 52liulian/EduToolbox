<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本表格互转 | EduToolbox · CSV·Markdown·HTML 互转</title>
<meta name="description" content="把 Excel / CSV / TSV 文本一键转成 Markdown 表格、HTML 表格，或反向转为纯文本；支持分隔符自动识别、表头设置、对齐方式与预览、复制、下载。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%97%3C/text%3E">
<link rel="stylesheet" href="../../assets/css/tool-common.css">
<link rel="stylesheet" href="table-convert.css">
</head>
<body>

<div class="container">
  <div class="workbench">
    <!-- ======================= 左侧设置面板 ======================= -->
    <aside class="panel setup-panel">
      <div class="block">
        <h2 class="block-title">① 来源格式</h2>
        <div class="chips chips-mini" id="delimChips">
          <button type="button" class="chip active" data-delim="auto">🪄 自动识别</button>
          <button type="button" class="chip" data-delim=",">逗号 ,</button>
          <button type="button" class="chip" data-delim="tab">制表符 ⇥</button>
          <button type="button" class="chip" data-delim=";">分号 ;</button>
          <button type="button" class="chip" data-delim="|">竖线 |</button>
          <button type="button" class="chip" data-delim="space">空格</button>
          <button type="button" class="chip" data-delim="custom">自定义…</button>
        </div>
        <div class="setting-row" id="customRow" hidden>
          <label for="customDelim">自定义分隔符</label>
          <input type="text" id="customDelim" value="·" maxlength="4" spellcheck="false">
        </div>
        <label class="check"><input type="checkbox" id="chkHeader" checked><span>第一行为表头</span></label>
        <label class="check"><input type="checkbox" id="chkTrim" checked><span>去除单元格首尾空格</span></label>
        <p class="block-hint">提示：Markdown 表格（含 <code>|</code> 分隔）也可直接粘贴进来反向转换。</p>
      </div>

      <div class="block">
        <h2 class="block-title">② 目标格式</h2>
        <div class="chips chips-mini" id="fmtChips">
          <button type="button" class="chip active" data-fmt="md">📝 Markdown</button>
          <button type="button" class="chip" data-fmt="html">🌐 HTML</button>
          <button type="button" class="chip" data-fmt="csv">📊 CSV</button>
          <button type="button" class="chip" data-fmt="txt">🔤 纯文本</button>
        </div>
        <div id="alignRow">
          <div class="chips chips-mini" id="alignChips">
            <button type="button" class="chip active" data-align="left">⬅ 左对齐</button>
            <button type="button" class="chip" data-align="center">↔ 居中</button>
            <button type="button" class="chip" data-align="right">➡ 右对齐</button>
          </div>
          <p class="block-hint">对齐仅对 Markdown 生效（HTML 可用 class 自行设置）。</p>
        </div>
      </div>

      <div class="block">
        <h2 class="block-title">③ 操作</h2>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btnConvert">🔄 立即转换</button>
          <div class="btn-row">
            <button type="button" class="btn btn-small" id="btnCopy">📋 复制结果</button>
            <button type="button" class="btn btn-small" id="btnDownload">📥 下载文件</button>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-small btn-ghost" id="btnSample">✨ 填入示例</button>
            <button type="button" class="btn btn-small btn-ghost" id="btnClear">🗑 清空</button>
          </div>
        </div>
        <div class="stat-grid tc-stats">
          <div class="stat-card"><span class="stat-num" id="statRows">0</span><span class="stat-label">行数</span></div>
          <div class="stat-card"><span class="stat-num" id="statCols">0</span><span class="stat-label">列数</span></div>
          <div class="stat-card"><span class="stat-num" id="statDelim">—</span><span class="stat-label">分隔符</span></div>
          <div class="stat-card"><span class="stat-num" id="statChars">0</span><span class="stat-label">字符数</span></div>
        </div>
      </div>
    </aside>

    <!-- ======================= 右侧转换区 ======================= -->
    <main class="stage-panel">
      <div class="stage-toolbar">
        <button type="button" class="icon-btn" id="fullscreenBtn" title="全屏展示">⛶</button>
        <button type="button" class="icon-btn" id="hideSetupBtn" title="隐藏设置栏">⚙</button>
      </div>
      <div class="stage-head">
        <h2 class="panel-title">📥 输入文本</h2>
        <span class="stage-ok" id="stageOk">等待输入</span>
      </div>
      <textarea id="srcInput" class="tc-input" rows="9" spellcheck="false"
        placeholder="在此粘贴表格文本，例如从 Excel 复制的内容：&#10;姓名,语文,数学,英语&#10;张三,92,88,95&#10;李四,85,91,79"></textarea>

      <div class="state state--empty" id="emptyState">
        <div class="state-icon">🔗</div>
        <div class="state-title">还没有转换结果</div>
        <div class="state-desc">粘贴数据后点「立即转换」，或点「✨ 填入示例」先看看效果</div>
      </div>

      <div id="resultArea" hidden>
        <div class="tc-block">
          <div class="chart-head">
            <span class="chart-title">👀 表格预览</span>
            <span class="chart-sub" id="previewSub">—</span>
          </div>
          <div class="tc-preview" id="previewWrap"></div>
        </div>

        <div class="tc-block">
          <div class="chart-head">
            <span class="chart-title">📤 转换结果</span>
            <span class="chart-sub" id="outLabel">Markdown</span>
          </div>
          <textarea id="outText" class="tc-output" rows="12" spellcheck="false" readonly></textarea>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../../assets/js/frame-bridge.js"></script>
<script src="../../assets/js/tool-stage-toolbar.js"></script>
<script src="table-convert.js"></script>
</body>
</html>
