<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼音标注</title>
<link rel="stylesheet" href="pinyin-annotator.css">
<link rel="stylesheet" href="../../assets/css/tool-common.css">
</head>
<body>
<div class="container">
  <div class="settings">
    <div class="field">
      <label>声调样式</label>
      <select id="toneType">
        <option value="symbol" selected>声调符号（mā）</option>
        <option value="num">数字声调（ma1）</option>
        <option value="none">无声调（ma）</option>
      </select>
    </div>
    <div class="field">
      <label>拼音位置</label>
      <select id="layout">
        <option value="top" selected>上方注音</option>
        <option value="side">右侧注音</option>
        <option value="line">换行注音</option>
      </select>
    </div>
    <div class="field">
      <label>字体大小</label>
      <select id="fontSize">
        <option value="16">小</option>
        <option value="20" selected>中</option>
        <option value="26">大</option>
      </select>
    </div>
  </div>

  <div class="layout">
    <div class="col">
      <label>输入文本</label>
      <textarea id="input" placeholder="请输入需要标注拼音的汉字文本…">春眠不觉晓，处处闻啼鸟。</textarea>
    </div>
    <div class="col">
      <label>标注结果</label>
      <div id="output" class="output"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="gen">标注拼音</button>
    <button class="btn btn-ghost" id="copy">复制文本</button>
    <button class="btn btn-ghost" id="copyHtml">复制带拼音HTML</button>
  </div>
</div>
<script src="../../assets/vendor/pinyin-pro.min.js"></script>
<script src="pinyin-annotator.js"></script>
</body>
</html>
