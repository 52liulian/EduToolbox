<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>值日安排表 | EduToolbox · 名单轮换·排班打印</title>
<meta name="description" content="导入学生名单与值日岗位，一键生成按天或按周轮换的值日安排表，支持跳过周末与打印张贴。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%85%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/css/tool-common.css">
<link rel="stylesheet" href="duty-roster.css">
</head>
<body>

<div class="container">
  <div class="workbench">
    <!-- ======================= 左侧设置面板 ======================= -->
    <aside class="panel setup-panel">
      <div class="block">
        <h2 class="block-title">① 学生名单</h2>
        <p class="block-hint">每行一名学生，顺序即轮换顺序</p>
        <textarea id="names" class="text-input" rows="7" placeholder="张三&#10;李四&#10;王五&#10;赵六&#10;孙七&#10;周八"></textarea>
        <div class="count-bar">共 <span id="nameCount">0</span> 人</div>
      </div>

      <div class="block">
        <h2 class="block-title">② 值日岗位</h2>
        <p class="block-hint">每行一个岗位</p>
        <div class="chips chips-mini" id="jobPresets"></div>
        <textarea id="jobs" class="text-input" rows="5" placeholder="扫地&#10;擦黑板&#10;倒垃圾&#10;摆桌椅"></textarea>
        <div class="count-bar">共 <span id="jobCount">0</span> 个岗位</div>
      </div>

      <div class="block">
        <h2 class="block-title">③ 排班规则</h2>
        <div class="setting-row">
          <label for="startDate">起始日期</label>
          <input type="date" id="startDate">
        </div>
        <div class="setting-row">
          <label for="periodCount">生成数量</label>
          <input type="number" id="periodCount" value="5" min="1" max="60" step="1">
        </div>
        <div class="field">
          <div class="field-label">轮换周期</div>
          <div class="chips" id="cycleChips">
            <button type="button" class="chip active" data-cycle="day">按天轮换</button>
            <button type="button" class="chip" data-cycle="week">按周轮换</button>
          </div>
        </div>
        <div class="setting-row">
          <label for="perJob">每岗人数</label>
          <input type="number" id="perJob" value="1" min="1" max="10" step="1">
        </div>
        <label class="check"><input type="checkbox" id="chkSkipWeekend" checked><span>跳过周六周日</span></label>
        <label class="check"><input type="checkbox" id="chkShuffle"><span>首次随机打乱名单</span></label>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btnGen">📅 生成安排表</button>
          <div class="btn-row">
            <button type="button" class="btn btn-small" id="btnCopy">📋 复制</button>
            <button type="button" class="btn btn-small" id="btnPrint">🖨 打印</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- ======================= 右侧表格 ======================= -->
    <main class="stage-panel">
      <!-- 舞台右上角工具栏：⛶ 舞台全屏（自动隐藏设置栏） / ⚙ 切换设置栏显隐 -->
      <div class="stage-toolbar">
        <button type="button" class="icon-btn" id="fullscreenBtn" title="全屏">⛶</button>
        <button type="button" class="icon-btn" id="hideSetupBtn" title="隐藏设置">⚙</button>
      </div>
      <div class="stage-head">
        <h2 class="panel-title">📋 值日安排</h2>
        <span class="stage-ok" id="stageOk">等待生成</span>
      </div>

      <div class="state state--empty" id="emptyState">
        <div class="state-icon">🧹</div>
        <div class="state-title">还没有安排表</div>
        <div class="state-desc">填好名单与岗位后点「生成安排表」，系统会按顺序自动轮换，人人轮到不落下</div>
      </div>

      <div id="tableArea" hidden>
        <div class="table-wrap">
          <table class="duty-table" id="dutyTable"></table>
        </div>
        <p class="table-tip" id="tableTip"></p>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="../../assets/js/frame-bridge.js"></script>
<script src="../../assets/js/tool-stage-toolbar.js"></script>
<script src="duty-roster.js"></script>
</body>
</html>
