<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师工作日历</title>
<link rel="stylesheet" href="teacher-calendar.css">
<link rel="stylesheet" href="../../assets/css/tool-common.css">
</head>
<body>
<div class="container">
  <h2>📅 教师工作日历</h2>
  <div class="ctrl">
    <label>开学日期 <input type="date" id="start"></label>
    <label>学期周数 <input type="number" id="weeks" min="16" max="30" value="20"></label>
    <button class="btn" id="gen">生成</button>
    <button class="btn ghost" id="print">打印</button>
  </div>
  <div class="cal" id="cal"></div>
</div>
<script src="teacher-calendar.js"></script>
</body>
</html>
