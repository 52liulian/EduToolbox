<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口算竞技场 | EduToolbox · 限时口算·班级PK</title>
<meta name="description" content="限时口算挑战与班级对战：分年级难度、四则运算、倒计时、队伍积分榜。课堂口算比赛与日常速算训练神器。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/css/tool-common.css">
<link rel="stylesheet" href="mental-math.css">
</head>
<body>

<div class="container">
  <div class="workbench">
    <!-- ======================= 左侧设置面板 ======================= -->
    <aside class="panel setup-panel">
      <div class="block">
        <h2 class="block-title">① 竞技模式</h2>
        <div class="chips" id="modeChips">
          <button type="button" class="chip active" data-mode="solo">🙋 个人训练</button>
          <button type="button" class="chip" data-mode="team">👥 班级对战</button>
        </div>
        <div class="team-setup" id="teamSetup" style="display:none">
          <p class="block-hint">对战队伍数量</p>
          <div class="chips" id="teamNumChips"></div>
        </div>
      </div>

      <div class="block">
        <h2 class="block-title">② 难度</h2>
        <div class="chips" id="diffChips">
          <button type="button" class="chip" data-diff="1">一年级</button>
          <button type="button" class="chip" data-diff="2">二年级</button>
          <button type="button" class="chip active" data-diff="3">三年级</button>
          <button type="button" class="chip" data-diff="4">四年级</button>
          <button type="button" class="chip" data-diff="5">五六年级</button>
          <button type="button" class="chip" data-diff="custom">自定义</button>
        </div>
        <p class="block-hint" id="diffHint">三年级：整十加减 + 九九乘法</p>
      </div>

      <div class="block" id="customOps" style="display:none">
        <h2 class="block-title">③ 自定义运算</h2>
        <div class="chips" id="opChips">
          <button type="button" class="chip" data-op="add">＋ 加法</button>
          <button type="button" class="chip" data-op="sub">－ 减法</button>
          <button type="button" class="chip" data-op="mul">× 乘法</button>
          <button type="button" class="chip" data-op="div">÷ 除法</button>
        </div>
        <div class="field row">
          <label for="custMax">数值上限</label>
          <input type="number" id="custMax" class="text-input" value="20" min="5" max="999">
        </div>
      </div>

      <div class="block">
        <h2 class="block-title">④ 限时（秒）</h2>
        <div class="chips" id="timeChips">
          <button type="button" class="chip" data-sec="30">30</button>
          <button type="button" class="chip active" data-sec="60">60</button>
          <button type="button" class="chip" data-sec="120">120</button>
          <button type="button" class="chip" data-sec="180">180</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="btnStart">🚀 开始挑战</button>
      </div>
    </aside>

    <!-- ======================= 右侧竞技舞台 ======================= -->
    <main class="stage-panel">
      <!-- 舞台右上角工具栏：⛶ 舞台全屏（自动隐藏设置栏） / ⚙ 切换设置栏显隐 -->
      <div class="stage-toolbar">
        <button type="button" class="icon-btn" id="fullscreenBtn" title="全屏">⛶</button>
        <button type="button" class="icon-btn" id="hideSetupBtn" title="隐藏设置">⚙</button>
      </div>
      <div class="stage-head">
        <h2 class="panel-title">🏟️ 竞技场</h2>
        <span class="stage-ok" id="stageOk">未开始</span>
      </div>

      <!-- 就绪态 -->
      <div class="stage-ready" id="readyView">
        <div class="ready-icon">🧮</div>
        <div class="ready-title">准备就绪</div>
        <div class="ready-desc" id="readyDesc">个人训练 · 限时 60 秒 · 答对得分</div>
      </div>

      <!-- 进行态 -->
      <div class="stage-running" id="runningView" style="display:none">
        <!-- 对战模式队伍条 -->
        <div class="team-bar" id="teamBar" style="display:none"></div>

        <div class="arena-top">
          <span class="q-index" id="qIndex">第 1 题</span>
          <span class="big-timer" id="timer">60</span>
          <span class="score-flash" id="score">0 分</span>
        </div>

        <div class="question" id="question">12 + 8 = ?</div>

        <div class="answer-box">
          <input type="number" id="answerInput" class="text-input" placeholder="输入答案，回车提交" autocomplete="off">
          <button type="button" class="btn btn-primary" id="btnSubmit">✔ 提交</button>
        </div>

        <div class="stats-line" id="statsLine">✅ <b id="okCnt">0</b> · ❌ <b id="noCnt">0</b></div>
      </div>

      <!-- 结束态 -->
      <div class="stage-done" id="doneView" style="display:none">
        <div class="done-icon">🏁</div>
        <div class="done-title" id="resultTitle">挑战结束</div>
        <div class="done-desc" id="resultDesc">共 20 题 · 答对 15 · 正确率 75%</div>
        <div class="rank-list" id="rankList"></div>
        <div class="done-actions">
          <button type="button" class="btn btn-primary" id="btnAgain">🔄 再来一局</button>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- 提示条 -->
<div class="toast" id="toast"></div>

<script src="../../assets/js/frame-bridge.js"></script>
<script src="../../assets/js/tool-stage-toolbar.js"></script>
<script src="mental-math.js"></script>
</body>
</html>
