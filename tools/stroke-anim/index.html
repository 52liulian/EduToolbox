<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汉字笔顺动画 | EduToolbox · 逐笔演示·笔顺分解</title>
<meta name="description" content="逐笔动画演示汉字笔顺，支持田字格/米字格、描红底字、速度调节、笔画分解与常用字速选，课堂投屏讲解生字必备。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%92%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../../assets/css/tool-common.css">
<link rel="stylesheet" href="stroke-anim.css">
</head>
<body>

<div class="container">
  <div class="workbench">
    <!-- ======================= 左侧设置面板 ======================= -->
    <aside class="panel setup-panel">
      <div class="block">
        <h2 class="block-title">① 输入汉字</h2>
        <p class="block-hint">可一次输入多个字，用 ‹ › 逐字切换</p>
        <div class="input-row">
          <button type="button" class="btn btn-small" id="btnPrevChar" title="上一个字">‹</button>
          <input type="text" id="charInput" class="text-input char-input" value="水" maxlength="40" placeholder="输入汉字，如：水">
          <button type="button" class="btn btn-small" id="btnNextChar" title="下一个字">›</button>
        </div>
        <div class="char-meta" id="charMeta">笔画数 —</div>
      </div>

      <div class="block">
        <h2 class="block-title">② 播放控制</h2>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btnPlay">▶ 播放笔顺</button>
          <div class="btn-row">
            <button type="button" class="btn btn-small" id="btnPrevStroke" title="上一笔">⏮ 上一笔</button>
            <button type="button" class="btn btn-small" id="btnNextStroke" title="下一笔">下一笔 ⏭</button>
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-small btn-ghost" id="btnReplay">↺ 重播</button>
            <button type="button" class="btn btn-small btn-ghost" id="btnShowAll">👁 显示整字</button>
          </div>
        </div>
      </div>

      <div class="block">
        <h2 class="block-title">③ 速度与显示</h2>
        <div class="field">
          <div class="field-label">播放速度</div>
          <div class="chips" id="speedChips">
            <button type="button" class="chip" data-speed="0.55">🐢 慢速</button>
            <button type="button" class="chip active" data-speed="1">🚶 常速</button>
            <button type="button" class="chip" data-speed="1.8">🐇 快速</button>
          </div>
        </div>
        <div class="field">
          <div class="field-label">格子样式</div>
          <div class="chips" id="gridChips">
            <button type="button" class="chip active" data-grid="tian">田字格</button>
            <button type="button" class="chip" data-grid="mi">米字格</button>
            <button type="button" class="chip" data-grid="none">无格</button>
          </div>
        </div>
        <label class="check">
          <input type="checkbox" id="chkTrace" checked>
          <span>显示描红底字</span>
        </label>
        <label class="check">
          <input type="checkbox" id="chkPen" checked>
          <span>显示笔尖指示</span>
        </label>
      </div>

      <div class="block">
        <h2 class="block-title">④ 常用字速选</h2>
        <p class="block-hint">本地内置 274 个常用字（点击即演示）；其它汉字联网自动获取</p>
        <div class="quick-grid" id="quickGrid"></div>
      </div>
    </aside>

    <!-- ======================= 右侧舞台 ======================= -->
    <main class="stage-panel">
      <div class="stage-toolbar">
        <button type="button" class="icon-btn" id="fullscreenBtn" title="全屏展示">⛶</button>
        <button type="button" class="icon-btn" id="hideSetupBtn" title="隐藏设置栏">⚙</button>
      </div>
      <div class="stage-head">
        <h2 class="panel-title">🖌️ 笔顺演示</h2>
        <span class="stage-ok" id="stageOk">就绪</span>
      </div>

      <div class="canvas-wrap">
        <div class="canvas-box">
          <svg id="hanziSvg" viewBox="0 0 1024 1024" aria-label="汉字笔顺演示"></svg>
        </div>
        <div class="state state--empty state--compact" id="emptyState" hidden>
          <div class="state-icon">🔤</div>
          <div class="state-title">暂无笔顺数据</div>
          <div class="state-desc" id="emptyDesc">该字暂无本地数据，联网后将自动获取</div>
        </div>
      </div>

      <div class="stroke-bar">
        <div class="stroke-bar-head">
          <span class="stroke-bar-title">笔画分解</span>
          <span class="stroke-bar-count" id="strokeCount">0 笔</span>
        </div>
        <div class="stroke-list" id="strokeList"></div>
      </div>
    </main>
  </div>
</div>

<!-- 提示条 -->
<div class="toast" id="toast"></div>

<script src="../../assets/js/frame-bridge.js"></script>
<script src="../../assets/js/tool-stage-toolbar.js"></script>
<script src="stroke-data.js"></script>
<script src="stroke-anim.js"></script>
</body>
</html>
